<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Essixx — Web Development &amp; Digital Transformation Studio | Pune</title>
    <meta
      name="description"
      content="Essixx freelancers in Pune. Contact us to develop your website — starting from ₹19,999 only."

      name="keywords"
      content="Essixx, web development Pune, website design Pune, digital transformation, mobile app development, SEO friendly websites"
    />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Pune" />

    <link rel="canonical" href="https://www.essixx.com/" />

    <!-- Apply the saved light/dark choice before first paint. -->
    <script>
      try {
        var t = localStorage.getItem('essixx-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

    />

    <link rel="icon" type="image/svg+xml" href="/brand/essixx-icon.svg" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="Essixx" />
